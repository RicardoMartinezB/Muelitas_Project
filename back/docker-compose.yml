version: "3.9"

services:
  db:
    image: postgres:15
    container_name: doctor_muelitas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doctor_muelitas_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data